<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="google-site-verification"
content="sVmUWQIDhJOkeMyHiIEUMv7dI8L9bCLRFJ6z2mkmavE">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learn English & Amazing Facts</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f7ff;
  color:#222;
}

header{
  background:linear-gradient(135deg,#1769aa,#673ab7);
  color:white;
  text-align:center;
  padding:25px 15px;
}

header img{
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid white;
}

header h1{
  margin:10px 0 5px;
  font-size:25px;
}

header p{
  margin:0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

#home h2{
  text-align:center;
  color:#333;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
}

.icon{
  font-size:40px;
}

.card h3{
  margin:10px 0 5px;
}

.lesson{
  display:none;
}

.lesson.active{
  display:block;
}

.back,.restart{
  border:0;
  background:#333;
  color:white;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:15px;
}

.quizbox{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.qtext{
  font-size:20px;
  font-weight:bold;
  margin-bottom:20px;
}

.option{
  display:block;
  width:100%;
  padding:14px;
  margin:10px 0;
  border:2px solid #ddd;
  border-radius:10px;
  background:#fafafa;
  cursor:pointer;
  font-size:16px;
  text-align:left;
}

.option:hover{
  background:#eef5ff;
}

.option:disabled{
  cursor:default;
}

.correct{
  background:#d9f7df !important;
  border-color:#27ae60 !important;
}

.wrong{
  background:#ffe0e0 !important;
  border-color:#e74c3c !important;
}

.result{
  font-weight:bold;
  font-size:18px;
  margin:15px 0;
}

.score{
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.progress{
  text-align:center;
  color:#666;
  margin-bottom:15px;
}

footer{
  margin-top:30px;
  background:#111827;
  color:white;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header>

<img src="profile.jpg.png" alt="Profile">

<h1>Learn English & Amazing Facts</h1>

<p>Interactive Quiz • English • GK • Science • Math</p>

</header>


<div class="container">

<div id="home">

<h2>📚 Choose a Topic</h2>

<div class="cards" id="topicCards"></div>

</div>


<div id="quizPage" class="lesson">

<button class="back" onclick="goHome()">← Back</button>

<h2 id="quizTitle"></h2>

<div id="quizArea"></div>

</div>

</div>


<footer>

© 2026 Learn English & Amazing Facts

</footer>


<script>

/* =========================
   10 QUESTIONS
========================= */

const quizData = {

"English Quiz":[

["Choose the correct article: ___ apple","A","An","The","No article",1],

["What is the opposite of HOT?","Warm","Cold","Big","Fast",1],

["What is the plural of CHILD?","Childs","Childes","Children","Child",2],

["Choose the correct sentence.","He are happy.","He am happy.","He is happy.","He be happy.",2],

["What is the past tense of GO?","Goed","Going","Gone","Went",3],

["Which word is a pronoun?","Book","Run","He","Beautiful",2],

["What is the synonym of HAPPY?","Sad","Angry","Joyful","Weak",2],

["Choose the correct preposition: The book is ___ the table.","in","on","at","from",1],

["Which one is a noun?","Quickly","Beautiful","Teacher","Run",2],

["Which sentence is correct?","She have a pen.","She has a pen.","She having a pen.","She haves a pen.",1]

]

};


/* =========================
   ICONS
========================= */

const icons = {

"English Quiz":"📚"

};


let currentTopic="";
let currentQuestion=0;
let score=0;
let answered=false;


/* =========================
   BUILD HOME
========================= */

function buildHome(){

const box=document.getElementById("topicCards");

box.innerHTML="";

Object.keys(quizData).forEach(function(topic){

const div=document.createElement("div");

div.className="card";

div.onclick=function(){

startQuiz(topic);

};

div.innerHTML=
"<div class='icon'>"+icons[topic]+"</div>"+
"<h3>"+topic+"</h3>"+
"<p>10 Questions</p>";

box.appendChild(div);

});

}


/* =========================
   START QUIZ
========================= */

function startQuiz(topic){

currentTopic=topic;

currentQuestion=0;

score=0;

answered=false;

document.getElementById("home").style.display="none";

document.getElementById("quizPage").classList.add("active");

document.getElementById("quizTitle").innerText=topic;

showQuestion();

window.scrollTo(0,0);

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

const item=quizData[currentTopic][currentQuestion];

let html="";

html+=
"<div class='quizbox'>";

html+=
"<div class='progress'>Question "+
(currentQuestion+1)+
" of "+
quizData[currentTopic].length+
"</div>";

html+=
"<div class='qtext'>"+
item[0]+
"</div>";


for(let i=1;i<=4;i++){

html+=
"<button class='option' id='opt"+(i-1)+
"' onclick='checkAnswer("+(i-1)+")'>"+
String.fromCharCode(65+i-1)+") "+
item[i]+
"</button>";

}


html+=
"<div id='result' class='result'></div>";

html+=
"<div class='score'>Score: "+
score+
"</div>";

html+="</div>";

document.getElementById("quizArea").innerHTML=html;

answered=false;

}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(choice){

if(answered){

return;

}

answered=true;

const item=quizData[currentTopic][currentQuestion];

const buttons=document.querySelectorAll(".option");

buttons.forEach(function(btn){

btn.disabled=true;

});


if(choice===item[5]){

score++;

document.getElementById("opt"+choice)
.classList.add("correct");

document.getElementById("result")
.innerHTML="✅ Correct Answer!";

}

else{

document.getElementById("opt"+choice)
.classList.add("wrong");

document.getElementById("opt"+item[5])
.classList.add("correct");

document.getElementById("result")
.innerHTML="❌ Wrong Answer!";

}


/* NEXT QUESTION */

setTimeout(function(){

currentQuestion++;

if(currentQuestion<
quizData[currentTopic].length){

showQuestion();

}

else{

showFinalScore();

}

},1000);

}


/* =========================
   FINAL SCORE
========================= */

function showFinalScore(){

let total=quizData[currentTopic].length;

document.getElementById("quizArea").innerHTML=

"<div class='quizbox'>"+
"<h2 style='text-align:center'>🎉 Quiz Completed!</h2>"+
"<div class='score'>"+
"You scored "+
score+
" / "+
total+
"</div>"+
"<p style='text-align:center'>"+
"Great job! Keep learning! 📚"+
"</p>"+
"<button class='restart' onclick='startQuiz(currentTopic)'>"+
"🔄 Try Again"+
"</button>"+
"</div>";

}


/* =========================
   GO HOME
========================= */

function goHome(){

document.getElementById("quizPage")
.classList.remove("active");

document.getElementById("home")
.style.display="block";

window.scrollTo(0,0);

}


/* =========================
   START
========================= */

document.addEventListener(
"DOMContentLoaded",
function(){

buildHome();

}
);

</script>

</body>
</html>
