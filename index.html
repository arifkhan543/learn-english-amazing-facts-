  Object.keys(quizData).forEach(function(topic){
    html+=
      "<div class='card' onclick='startQuiz("+JSON.stringify(topic)+")'>"+
      "<span class='icon'>"+(icons[topic] || "📚")+"</span>"+
      topic+
      "</div>";
  });
  document.getElementById("topicCards").innerHTML=html;
}

function showHome(){
  document.getElementById("home").style.display="block";
  document.getElementById("quizPage").classList.remove("active");
  window.scrollTo(0,0);
}

function startQuiz(topic){
  currentTopic=topic;
  currentQuestion=0;
  score=0;
  answered=false;

  document.getElementById("home").style.display="none";
  document.getElementById("quizPage").classList.add("active");

  showQuestion();
  window.scrollTo(0,0);
}

function showQuestion(){
  const item=quizData[currentTopic][currentQuestion];

  let html="";
  html+="<div class='quizbox'>";
  html+="<div class='progress'>Question "+(currentQuestion+1)+" of "+quizData[currentTopic].length+"</div>";
  html+="<div class='qtext'>"+item[0]+"</div>";

  for(let i=1;i<=4;i++){
    html+="<button class='option' id='opt"+(i-1)+"' onclick='checkAnswer("+(i-1)+")'>"+
      String.fromCharCode(65+i-1)+") "+item[i]+
      "</button>";
  }

  html+="<div id='result' class='result'></div>";
  html+="<div class='score'>Score: "+score+"</div>";
  html+="</div>";

  document.getElementById("quizArea").innerHTML=html;
  answered=false;
}

function checkAnswer(choice){
  if(answered){
    return;
  }

  answered=true;

  const item=quizData[currentTopic][currentQuestion];
  const buttons=document.querySelectorAll(".option");

  buttons.forEach(function(btn){
    btn.disabled=true;
  });

  if(choice===item[5]){
    score++;
    document.getElementById("opt"+choice).classList.add("correct");
    document.getElementById("result").innerHTML="✅ Correct Answer!";
  }else{
    document.getElementById("opt"+choice).classList.add("wrong");
    document.getElementById("opt"+item[5]).classList.add("correct");
    document.getElementById("result").innerHTML="❌ Wrong Answer!";
  }

  setTimeout(function(){
    currentQuestion++;

    if(currentQuestion<quizData[currentTopic].length){
      showQuestion();
    }else{
      showFinalScore();
    }
  },1000);
}

function showFinalScore(){
  let total=quizData[currentTopic].length;

  let html="";
  html+="<div class='quizbox final'>";
  html+="<h2>🎉 Quiz Completed!</h2>";
  html+="<h3>"+currentTopic+"</h3>";
  html+="<p>Your Score</p>";
  html+="<h1>"+score+" / "+total+"</h1>";

  if(score===total){
    html+="<p>🏆 Perfect Score!</p>";
  }else if(score>=total/2){
    html+="<p>👏 Good Job!</p>";
  }else{
    html+="<p>💪 Keep Practicing!</p>";
  }

  html+="<button class='try' onclick='startQuiz("+JSON.stringify(currentTopic)+")'>Try Again</button>";
  html+="<button class='try' onclick='showHome()'>Back to Home</button>";
  html+="</div>";

  document.getElementById("quizArea").innerHTML=html;
}

buildHome();

</script>

</body>
</html>
