let currentTopic="";
let currentQuestion=0;
let score=0;
let answered=false;

function buildHome(){
const box=document.getElementById("topicCards");
box.innerHTML="";

Object.keys(quizData).forEach(function(topic){

const div=document.createElement("div");

div.className="card";

div.onclick=function(){
startQuiz(topic);
};

div.innerHTML=
"<div class='icon'>"+icons[topic]+"</div>"+
"<h3>"+topic+"</h3>"+
"<p>20 Questions</p>";

box.appendChild(div);

});
}

function startQuiz(topic){

currentTopic=topic;
currentQuestion=0;
score=0;

document.getElementById("home").style.display="none";

document.getElementById("quizPage").classList.add("active");

document.getElementById("quizTitle").textContent=topic;

showQuestion();

window.scrollTo(0,0);
}

function showQuestion(){

const list=quizData[currentTopic];

const item=list[currentQuestion];

answered=false;

let html="<div class='quizbox'>";

html+="<div class='progress'>Question "+
(currentQuestion+1)+" of "+list.length+"</div>";

html+="<div class='qtext'>"+item[0]+"</div>";

for(let i=1;i<=4;i++){

html+="<button class='option' id='opt"+
(i-1)+"' onclick='checkAnswer("+
(i-1)+")'>"+
String.fromCharCode(64+i)+") "+
item[i]+
"</button>";

}

html+="<div id='result' class='result'></div>";

html+="</div>";

document.getElementById("quizArea").innerHTML=html;
}

function checkAnswer(choice){

if(answered)return;

answered=true;

const item=quizData[currentTopic];

const buttons=document.querySelectorAll(".option");

buttons.forEach(function(btn){
btn.disabled=true;
});

if(choice===item[5]){

score++;

document.getElementById("opt"+choice)
.classList.add("correct");

document.getElementById("result")
.textContent="✅ Correct!";

}else{

document.getElementById("opt"+choice)
.classList.add("wrong");

document.getElementById("opt"+item[5])
.classList.add("correct");

document.getElementById("result")
.textContent=
"❌ Wrong! Correct answer: "+
String.fromCharCode(65+item[5])+
") "+item[item[5]+1];

}

setTimeout(function(){

currentQuestion++;

if(currentQuestion<quizData[currentTopic].length){

showQuestion();

}else{

showScore();

}

},900);
}

function showScore(){

const total=quizData[currentTopic].length;

const percent=Math.round(score/total*100);

let message="Keep learning! 📚";

if(percent>=90){

message="🏆 Excellent! Amazing!";

}else if(percent>=70){

message="🎉 Great job!";

}else if(percent>=50){

message="👍 Good try!";

}else{

message="💪 Keep practicing!";

}

document.getElementById("quizArea").innerHTML=

"<div class='score'>"+
message+
"<br><br>Your Score: "+
score+
" / "+
total+
"<br>Percentage: "+
percent+
"%<br><br>"+
"<button class='restart' onclick='startQuiz(currentTopic)'>"+
"🔄 Try Again"+
"</button>"+
"</div>";
}

function goHome(){

document.getElementById("quizPage")
.classList.remove("active");

document.getElementById("home")
.style.display="block";

window.scrollTo(0,0);
}

document.addEventListener("DOMContentLoaded",buildHome);

</script>
